name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        version: "0.27.0"
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit upgrade
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry server --check-only
        calcit calcit.cirru analyze deprecated --summary-only
        calcit calcit.cirru --entry server analyze deprecated --summary-only

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web and server artifacts
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"
        calcit calcit.cirru --entry server ir
        mkdir -p dist-server
        cp js-out/program-ir.cirru dist-server/compact.cirru
        cp calcit.cirru deps.cirru package.json dist-server/

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    - name: Upload and verify frontend assets on COS
      if: steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}


    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@2554a1e574cf229fb144f23ea5971dbdca8ae8e3 # v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Upload server script
      id: deploy-server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@2554a1e574cf229fb144f23ea5971dbdca8ae8e3 # v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist-server/*'
        dest: 'rsync-user@tiye.me:/servers/tabletwo/'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-server.outputs.status }}"
